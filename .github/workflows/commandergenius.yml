# Builds Commander Genius v3.6.4 (latest upstream release) as an Android APK.
# Place this file at .github/workflows/commandergenius.yml in a fork of
# https://github.com/pelya/commandergenius, then run it from the Actions tab.
# The APK appears under the run's "Artifacts" section.

name: commandergenius
on:
  workflow_dispatch: {}
  push:
    branches:
      - '*'

jobs:
  build:
    env:
      APP_NAME: commandergenius
      CG_TAG: v3.6.4
      CG_VERSION_NAME: "3.6.4 Release"
      CG_VERSION_CODE: "364000"
      ARCH_LIST: armeabi-v7a arm64-v8a
      ANDROID_BUILD_TOOLS: 37.0.0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    runs-on: ubuntu-latest

    steps:
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set NDK version
        run: |
          echo "PATH=$ANDROID_NDK_LATEST_HOME:$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS:$PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Check out SDL2 submodules
        run: >
          git submodule update --init --recursive --depth=1
          project/jni/sdl2 project/jni/sdl2_image
          project/jni/sdl2_mixer project/jni/sdl2_ttf

      - name: Disable WavPack in SDL2_mixer (unused by the game; its ARMv7 assembly breaks with the current NDK)
        run: |
          sed -i 's/^SUPPORT_WAVPACK ?= true/SUPPORT_WAVPACK := false/' project/jni/sdl2_mixer/Android.mk
          grep -n '^SUPPORT_WAVPACK' project/jni/sdl2_mixer/Android.mk

      - name: Check out Commander Genius at the latest release
        run: |
          D=project/jni/application/commandergenius/commandergenius
          rm -rf "$D"
          git clone --depth 1 --branch "$CG_TAG" --recurse-submodules --shallow-submodules https://github.com/gerstrong/Commander-Genius.git "$D"
          ls "$D/src/engine/cosmos" | head

      - name: Symlink the application dir
        run: |
          ln -s ${APP_NAME} project/jni/application/src

      - name: Set architectures, version and controller support
        run: |
          CFG=project/jni/application/src/AndroidAppSettings.cfg
          sed -i "s/^MultiABI=.*/MultiABI='${ARCH_LIST}'/" $CFG
          sed -i "s/^AppVersionCode=.*/AppVersionCode=${CG_VERSION_CODE}/" $CFG
          sed -i "s/^AppVersionName=.*/AppVersionName=\"${CG_VERSION_NAME}\"/" $CFG
          # Pass physical gamepads through as SDL joysticks so Commander Genius
          # sees them directly and you can map any button in its settings.
          sed -i "s/^AppUsesJoystick=.*/AppUsesJoystick=y/" $CFG
          # Lua needs fseeko/ftello with 64-bit offsets, which 32-bit Android only has from API 24
          # (the Play Store minimum anyway)
          if grep -q '^APP_PLATFORM=' $CFG; then sed -i 's/^APP_PLATFORM=.*/APP_PLATFORM=android-24/' $CFG; else echo 'APP_PLATFORM=android-24' >> $CFG; fi
          # Android 15+/16 devices with 16 KB memory pages refuse libraries aligned to 4 KB
          sed -i "s|^AppLdflags='\(.*\)'|AppLdflags='\1 -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'|" $CFG
          # xxd.c is a build-time helper tool with its own main(); keep it out of the app
          sed -i "s|^AppBuildExclude='\(.*\)'|AppBuildExclude='\1 commandergenius/src/engine/xxd.c commandergenius/GsKit/base/lua/lua.c'|" $CFG
          grep -E '^(MultiABI|AppVersion|AppUsesJoystick|RedefinedKeysGamepad|AppBuildExclude|APP_PLATFORM|AppLdflags)' $CFG

      - name: Generate gamelauncher.menu.h (normally done by CMake)
        run: |
          which xxd || sudo apt-get install -y xxd
          cd project/jni/application/commandergenius/commandergenius/src/engine
          xxd -i gamelauncher.menu gamelauncher.menu.h
          head -3 gamelauncher.menu.h
          # main() lives in CGenius.cpp, which doesn't include SDL_main.h, so on Android it isn't
          # renamed to SDL_main and the launcher can't find it (app closes instantly). Include it.
          sed -i 's|^#include "CGeniusEntry.h"|#include <SDL_main.h>\n#include "CGeniusEntry.h"|' ../CGenius.cpp
          grep -n 'include' ../CGenius.cpp

      - name: Patch Java files and build libraries
        shell: bash
        run: |
          set -o pipefail
          ./changeAppSettings.sh 2>&1 | tee settings.log && exit 0
          grep -n -i -E 'error|fail|not found|No such|\*\*\*' settings.log | head -50 > errs.txt || true
          tail -20 settings.log >> errs.txt
          split -l 7 errs.txt chunk_
          for f in chunk_*; do echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done
          exit 1

      - name: Set up Gradle and Android SDK licenses
        working-directory: project
        run: |
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          ./gradlew assembleRelease || true
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=`pwd`
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "proguard.config=proguard.cfg;proguard-local.cfg" >> local.properties

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log && exit 0
          # Surface the compiler errors as annotations so they are readable via the API
          grep -n -E 'error:|undefined symbol|referenced by|Error [0-9]|No rule to make|undefined reference|fatal error' build.log | grep -v -E 'warning:|-soname|-o \./obj' | cut -c1-300 | head -60 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          split -l 6 errs.txt chunk_
          for f in chunk_*; do echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done
          exit 1

      - name: Package
        run: |
          mkdir -p upload/
          sed -i 's/^zipalign 4 /zipalign -P 16 4 /' sign.sh
          ./sign.sh
          mv *.apk upload/
          # Report the memory-page alignment of every native library (needs 0x4000 = 16 KB for Android 16).
          # Informational only: never fails the build.
          (
            set +e
            RE=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
            mkdir -p libcheck
            python3 -c "import zipfile,sys,glob; z=zipfile.ZipFile(glob.glob('upload/*.apk')[0]); n=[i for i in z.namelist() if i.endswith('.so')]; print('so files:', n); z.extractall('libcheck', n)"
            BAD=""; ALL=""
            for so in $(find libcheck -name '*.so'); do
              A=$($RE -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
              ALL="$ALL ${so#libcheck/}=$A;"
              case "$A" in *0x4000*|*0x10000*) ;; *) BAD="$BAD ${so#libcheck/}($A)";; esac
            done
            echo "::notice::Library alignment:$ALL"
            [ -n "$BAD" ] && echo "::warning::Not 16 KB aligned:$BAD"
          ) || true

      - uses: actions/upload-artifact@v7
        with:
          name: CommanderGenius-3.6.4-apk
          path: upload
          if-no-files-found: error

  test:
    # Boot an Android emulator, install the APK, launch it and report any crash from logcat
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: google_apis
          - api: 36
            target: google_apis_ps16k
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: CommanderGenius-3.6.4-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the launch test script
        run: |
          cat > launch-test.sh <<'SH'
          #!/bin/bash
          set -x
          APK=$(ls apk/*.apk | head -1)
          adb install -r -g "$APK" 2>&1 | tail -3
          adb logcat -c
          adb shell monkey -p net.sourceforge.clonekeenplus -c android.intent.category.LAUNCHER 1
          sleep 45
          adb logcat -d > logcat.txt
          PID=$(adb shell pidof net.sourceforge.clonekeenplus | tr -d '\r')
          echo "::notice::API $(adb shell getprop ro.build.version.sdk | tr -d '\r'), page size $(adb shell getconf PAGE_SIZE | tr -d '\r'): app process after 45s: ${PID:-NOT RUNNING}"
          grep -n -E 'FATAL|AndroidRuntime|DEBUG +:|beginning of crash|Abort message|signal [0-9]+|libapplication|UnsatisfiedLink|dlopen|clonekeenplus|Commander|CGenius|SDL' logcat.txt \
            | grep -v -E 'ActivityTaskManager: Displayed|chatty' | cut -c1-280 | tail -60 > errs.txt || true
          split -l 6 errs.txt chunk_ || true
          for f in chunk_*; do [ -s "$f" ] && echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done
          true
          SH
          chmod +x launch-test.sh

      - name: Launch the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: ./launch-test.sh
